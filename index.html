<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Laporan Progres Lapangan</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 15px; }
        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
        h2 { margin-top: 0; font-size: 16px; text-align: center; background: #007bff; color: white; padding: 10px; border-radius: 4px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            font-family: Arial, sans-serif; 
            font-size: 14px; 
            font-weight: bold; 
            letter-spacing: 0.5px; 
            text-transform: uppercase; 
            cursor: pointer; 
            transition: background-color 0.2s ease;
        }
        .btn-clear { background-color: #dc3545; color: white; }
        .btn-clear:hover { background-color: #c82333; }
        .btn-copy { background-color: #28a745; color: white; }
        .btn-copy:hover { background-color: #218838; }
        #previewText { width: 100%; height: 580px; font-family: monospace; white-space: pre-wrap; background: #eef2f7; padding: 12px; border: 1px solid #000; border-radius: 4px; font-size: 13px; }
        .hidden { display: none; }
        .pic-checkboxes { display: flex; flex-wrap: wrap; gap: 10px; background: #f8f9fa; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .pic-checkboxes label { font-weight: normal; margin: 0; cursor: pointer; }
        .section-header { font-weight: bold; background: #e9ecef; padding: 6px; margin: 10px 0; border-left: 4px solid #007bff; }
        .hint { font-size: 11px; color: #6c757d; margin-top: 2px; }
    </style>
</head>
<body>

<div class="container">
    <!-- FORM INPUT -->
    <div class="card">
        <h2>FORM INPUT LAPORAN</h2>
        <form id="reportForm">
            <!-- INFORMASI UMUM -->
            <div class="section-header">Informasi Umum</div>
            <div class="form-group">
                <label>Jenis Laporan & Kegiatan</label>
                <select id="jenisLaporan">
                    <option value="" disabled selected hidden>-- Pilih Jenis Laporan --</option>
                    <option value="KEGIATAN INSTALASI">KEGIATAN INSTALASI</option>
                    <option value="KEGIATAN MAINTENANCE">KEGIATAN MAINTENANCE</option>
                    <option value="KEGIATAN REAKTIVASI">KEGIATAN REAKTIVASI</option>
                    <option value="KEGIATAN RELOKASI">KEGIATAN RELOKASI</option>
                    <option value="KEGIATAN SURVEI">KEGIATAN SURVEI</option>
                    <option value="LAINNYA">KEGIATAN LAINNYA (Ketik Manual)</option>
                </select>
                <input type="text" id="jenisLaporanCustom" class="hidden" placeholder="Masukkan Jenis Kegiatan (Contoh: MASANG CCTV)" style="margin-top: 5px;">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="tanggal" required>
                </div>
                <div class="form-group">
                    <label>Project / ISP</label>
                    <select id="project">
                        <option value="" disabled selected hidden>-- Pilih ISP --</option>
                        <option value="FTTH ISP JAKINET">FTTH ISP JAKINET</option>
                        <option value="FTTH ISP JELANTIK">FTTH ISP JELANTIK</option>
                        <option value="CUSTOM">LAINNYA (Ketik Manual)</option>
                    </select>
                    <input type="text" id="projectCustom" class="hidden" placeholder="Nama Project / ISP" style="margin-top: 5px;">
                </div>
            </div>

            <!-- PIC ON SITE & LEADER -->
            <div class="row">
                <div class="form-group">
                    <label>PIC On Site</label>
                    <div class="pic-checkboxes">
                        <label><input type="checkbox" class="pic-check" value="Yohan"> Yohan</label>
                        <label><input type="checkbox" class="pic-check" value="Aryan"> Aryan</label>
                        <label><input type="checkbox" class="pic-check" value="Tami"> Tami</label>
                        <label><input type="checkbox" class="pic-check" value="Andri"> Andri</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Leader</label>
                    <select id="leaderSelect">
                        <option value="" disabled hidden>-- Pilih Leader --</option>
                        <option value="Yohan" selected>Yohan</option>
                        <option value="Aryan">Aryan</option>
                        <option value="Tami">Tami</option>
                        <option value="Andri">Andri</option>
                        <option value="CUSTOM">Lainnya (Ketik Manual)</option>
                    </select>
                    <input type="text" id="leaderCustom" class="hidden" placeholder="Nama Leader" style="margin-top: 5px;">
                </div>
            </div>
            <div class="form-group" style="margin-top: -5px;">
                <input type="text" id="picCustom" placeholder="PIC Tambahan/Lainnya (Opsional)">
            </div>

            <!-- LOKASI SETUP -->
            <div class="section-header">Lokasi Pekerjaan</div>
            <div class="form-group">
                <label>Kategori Lokasi</label>
                <select id="katLokasi">
                    <option value="" disabled selected hidden>-- Pilih Kategori Lokasi --</option>
                    <option value="RUSUN_BLOK" id="optKatRusunBlok">Rusun Blok (Lantai 1-5)</option>
                    <option value="RUSUN_TOWER" id="optKatRusunTower">Rusun Tower (Highrise)</option>
                    <option value="PERUMAHAN" id="optKatPerumahan">Perumahan</option>
                    <option value="CUSTOM">Custom Alamat</option>
                </select>
            </div>

            <!-- OPTIONS LOKASI: RUSUN BLOK -->
            <div id="boxRusunBlok" class="hidden">
                <div class="row">
                    <div class="form-group">
                        <label>Nama Rusun</label>
                        <select id="rusunBlokNama">
                            <option value="" disabled selected hidden>-- Pilih Rusun --</option>
                            <option value="Rusun Pinus">Rusun Pinus</option>
                            <option value="Rusun Pulogebang Blok">Rusun Pulogebang Blok</option>
                            <option value="Rusun KM2">Rusun KM2</option>
                            <option value="Rusun Tipar Cakung">Rusun Tipar Cakung</option>
                            <option value="Rusun Cakung Barat">Rusun Cakung Barat</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Blok</label>
                        <input type="text" id="rusunBlokKode" placeholder="Contoh: A1 / A">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Lantai (1-5)</label>
                        <select id="rusunBlokLantai">
                            <option value="" disabled selected hidden>-- Pilih Lt --</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>No. Unit</label>
                        <select id="rusunBlokUnit">
                            <option value="" disabled selected hidden>-- Pilih Unit --</option>
                            <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option>
                            <option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option>
                            <option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option>
                            <option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option>
                        </select>
                        <div class="hint">Otomatis gabung (Lt 3 & Unit 10 -> UNIT 310)</div>
                    </div>
                </div>
            </div>

            <!-- OPTIONS LOKASI: RUSUN TOWER -->
            <div id="boxRusunTower" class="hidden">
                <div class="row">
                    <div class="form-group">
                        <label>Nama Rusun Tower</label>
                        <select id="rusunTowerNama">
                            <option value="" disabled selected hidden>-- Pilih Rusun Tower --</option>
                            <option value="Rusun Pulogebang Tower" id="optRusunPgbTower">Rusun Pulogebang Tower</option>
                            <option value="Rusun Nagrak" id="optRusunNagrak">Rusun Nagrak</option>
                        </select>
                    </div>
                    <div class="form-group" id="groupTowerKode">
                        <label>Tower</label>
                        <select id="rusunTowerKodeSelect">
                            <option value="" disabled selected hidden>-- Pilih Tower --</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                        <input type="text" id="rusunTowerKode" class="hidden" placeholder="Contoh: 1 / A">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Lantai (1-16)</label>
                        <select id="rusunTowerLantai">
                            <option value="" disabled selected hidden>-- Pilih Lt --</option>
                            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                            <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                            <option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>No. Unit</label>
                        <select id="rusunTowerUnit">
                            <option value="" disabled selected hidden>-- Pilih Unit --</option>
                            <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option>
                            <option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option>
                            <option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option>
                            <option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option>
                            <option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option>
                            <option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option>
                        </select>
                        <div class="hint">Otomatis gabung (Lt 13 & Unit 17 -> UNIT 1317)</div>
                    </div>
                </div>
            </div>

            <!-- OPTIONS LOKASI: PERUMAHAN -->
            <div id="boxPerumahan" class="hidden">
                <div class="row">
                    <div class="form-group">
                        <label>Nama Perumahan</label>
                        <select id="perumahanNama">
                            <option value="" disabled selected hidden>-- Pilih Perumahan --</option>
                            <option value="WARINGIN KURUNG">WARINGIN KURUNG</option>
                            <option value="PARAMA">PARAMA</option>
                            <option value="CASANOVA">CASANOVA</option>
                            <option value="TAMBUN">TAMBUN</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Blok / No. Rumah</label>
                        <input type="text" id="perumahanDetail" placeholder="Contoh: BLOK C2 NO. 51">
                    </div>
                </div>
            </div>

            <!-- OPTIONS LOKASI: CUSTOM -->
            <div id="boxCustom" class="hidden">
                <div class="form-group">
                    <label>Alamat Custom Lengkap</label>
                    <input type="text" id="alamatCustom" placeholder="Ketikkan alamat lengkap di sini">
                </div>
            </div>

            <!-- WAKTU & STATUS -->
            <div class="section-header">Waktu & Aktivitas</div>
            <div class="row">
                <div class="form-group">
                    <label>Clock In</label>
                    <input type="time" id="clockIn">
                </div>
                <div class="form-group">
                    <label>Clock Out</label>
                    <input type="time" id="clockOut">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Activity (Otomatis)</label>
                    <input type="text" id="activity" readonly style="background-color: #e9ecef; cursor: not-allowed;" placeholder="Otomatis terisi">
                </div>
                <div class="form-group">
                    <label>Status Activity</label>
                    <select id="statusActivity">
                        <option value="" disabled selected hidden>-- Pilih Status --</option>
                        <option value="ONLINE">ONLINE</option>
                        <option value="PROGRES">PROGRES</option>
                        <option value="PENDING">PENDING</option>
                        <option value="FAILED">FAILED</option>
                        <option value="CUSTOM">LAINNYA (Ketik Manual)</option>
                    </select>
                    <input type="text" id="statusCustom" class="hidden" placeholder="Status Activity Custom" style="margin-top: 5px;">
                </div>
            </div>

            <!-- KHUSUS MAINTENANCE: JENIS PENANGANAN, PROBLEM & ACTION -->
            <div id="boxJenisMaintenance" class="hidden">
                <div class="form-group">
                    <label>Jenis Perbaikan (Maintenance)</label>
                    <select id="jenisKendala">
                        <option value="" disabled selected hidden>-- Pilih Jenis Perbaikan --</option>
                        <option value="KABEL_PUTUS">Perbaikan Kabel Putus / Splicing</option>
                        <option value="TUKAR_MODEM">Ganti / Tukar Modem (ONT)</option>
                        <option value="SETTING_OLT">Setting OLT / Redaman</option>
                        <option value="LAINNYA">Lainnya / Full Check</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Problem (Kendala)</label>
                    <input type="text" id="problemText" placeholder="Contoh: LOS Red (Kabel Dropcore Putus di Riser)">
                </div>
                <div class="form-group">
                    <label>Action (Tindakan / Penanganan)</label>
                    <input type="text" id="actionText" placeholder="Contoh: Splicing ulang kabel dropcore di lantai 3">
                </div>
            </div>

            <!-- DATA TEKNIS PERANGKAT -->
            <div class="section-header">Data Teknis & Perangkat</div>
            <div class="form-group" id="groupRedaman">
                <label>Redaman / Power</label>
                <select id="power">
                    <option value="" disabled selected hidden>-- Pilih Redaman (-dBm) --</option>
                    <option value="5">-5 dBm</option>
                    <option value="6">-6 dBm</option>
                    <option value="7">-7 dBm</option>
                    <option value="8">-8 dBm</option>
                    <option value="9">-9 dBm</option>
                    <option value="10">-10 dBm</option>
                    <option value="11">-11 dBm</option>
                    <option value="12">-12 dBm</option>
                    <option value="13">-13 dBm</option>
                    <option value="14">-14 dBm</option>
                    <option value="15">-15 dBm</option>
                    <option value="16">-16 dBm</option>
                    <option value="17">-17 dBm</option>
                    <option value="18">-18 dBm</option>
                    <option value="19">-19 dBm</option>
                    <option value="20">-20 dBm</option>
                    <option value="21">-21 dBm</option>
                    <option value="22">-22 dBm</option>
                    <option value="23">-23 dBm</option>
                    <option value="24">-24 dBm</option>
                    <option value="25">-25 dBm</option>
                    <option value="26">-26 dBm</option>
                    <option value="27">-27 dBm</option>
                    <option value="28">-28 dBm</option>
                    <option value="29">-29 dBm</option>
                    <option value="30">-30 dBm</option>
                    <option value="31">-31 dBm</option>
                    <option value="32">-32 dBm</option>
                    <option value="33">-33 dBm</option>
                </select>
            </div>

            <div class="form-group" id="groupInterfaceOnu">
                <label>Interface ONU (Opsional)</label>
                <input type="text" id="interfaceOnu" placeholder="Format: 1/2/1:1">
            </div>

            <div class="form-group" id="groupOdpPort">
                <label>ODP Port (Opsional)</label>
                <input type="text" id="odpPort" placeholder="Contoh: ODP-WRG-C2 / 02">
            </div>

            <!-- SN ONT NORMAL -->
            <div class="form-group" id="groupSnOnu">
                <label>SN ONT / Modem</label>
                <input type="text" id="snOnu" placeholder="Contoh: RTEGX60AJSJ">
            </div>

            <!-- SN ONT TUKAR MODEM (KHUSUS MAINTENANCE) -->
            <div id="groupSnTukarModem" class="hidden">
                <div class="form-group">
                    <label style="color: #dc3545;">SN ONT LAMA</label>
                    <input type="text" id="snOntLama" placeholder="SN Modem Lama yang diganti">
                </div>
                <div class="form-group">
                    <label style="color: #28a745;">SN ONT BARU</label>
                    <input type="text" id="snOntBaru" placeholder="SN Modem Baru yang dipasang">
                </div>
            </div>

            <div class="form-group">
                <label>Catatan / Keterangan Lain (Opsional)</label>
                <input type="text" id="catatan" placeholder="Keterangan tambahan jika ada">
            </div>
        </form>
    </div>

    <!-- PREVIEW & SALIN -->
    <div class="card">
        <h2>PREVIEW LAPORAN WA</h2>
        <textarea id="previewText" readonly></textarea>
        <div class="btn-group">
            <button class="btn-clear" onclick="resetForm()">🔄 RESET</button>
            <button class="btn-copy" onclick="copyText()">📋 COPY</button>
        </div>
    </div>
</div>

<script>
    function setTanggalHariIni() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById('tanggal').value = `${year}-${month}-${day}`;
    }

    setTanggalHariIni();

    const allInputs = document.querySelectorAll('input, select');
    allInputs.forEach(item => item.addEventListener('input', updateViewAndPreview));

    function updateViewAndPreview() {
        // Filter Lokasi & Rusun Tower Berdasarkan Project / ISP
        const projVal = document.getElementById('project').value;
        const optPerumahan = document.getElementById('optKatPerumahan');
        const optRusunNagrak = document.getElementById('optRusunNagrak');
        const optRusunPgbTower = document.getElementById('optRusunPgbTower');
        const katLokSelect = document.getElementById('katLokasi');
        const rusunTowerNamaSelect = document.getElementById('rusunTowerNama');

        if (projVal === 'FTTH ISP JAKINET') {
            optPerumahan.style.display = 'none';
            optRusunNagrak.style.display = 'none';
            optRusunPgbTower.style.display = 'block';

            if (katLokSelect.value === 'PERUMAHAN') {
                katLokSelect.value = '';
            }
            if (rusunTowerNamaSelect.value === 'Rusun Nagrak') {
                rusunTowerNamaSelect.value = '';
            }
        } else if (projVal === 'FTTH ISP JELANTIK') {
            optPerumahan.style.display = 'block';
            optRusunNagrak.style.display = 'block';
            optRusunPgbTower.style.display = 'none';

            if (rusunTowerNamaSelect.value === 'Rusun Pulogebang Tower') {
                rusunTowerNamaSelect.value = '';
            }
        } else {
            optPerumahan.style.display = 'block';
            optRusunNagrak.style.display = 'block';
            optRusunPgbTower.style.display = 'block';
        }

        // Handle Pilihan Tower (Dropdown vs Input Manual)
        const rusunTowerNama = rusunTowerNamaSelect.value;
        const groupTowerKode = document.getElementById('groupTowerKode');
        const towerSelect = document.getElementById('rusunTowerKodeSelect');
        const towerInput = document.getElementById('rusunTowerKode');

        if (rusunTowerNama === 'Rusun Pulogebang Tower') {
            groupTowerKode.classList.add('hidden');
        } else if (rusunTowerNama === 'Rusun Nagrak') {
            groupTowerKode.classList.remove('hidden');
            towerSelect.classList.remove('hidden');
            towerInput.classList.add('hidden');
        } else {
            groupTowerKode.classList.remove('hidden');
            towerSelect.classList.add('hidden');
            towerInput.classList.remove('hidden');
        }

        // Toggle Jenis Laporan Custom
        const jenisLapVal = document.getElementById('jenisLaporan').value;
        const isJenisCustom = (jenisLapVal === 'LAINNYA');
        document.getElementById('jenisLaporanCustom').classList.toggle('hidden', !isJenisCustom);

        // Synchronize Activity Input
        const activityInput = document.getElementById('activity');
        if (isJenisCustom) {
            const customAct = document.getElementById('jenisLaporanCustom').value.trim();
            activityInput.value = customAct.toUpperCase();
        } else if (jenisLapVal) {
            activityInput.value = jenisLapVal.replace('KEGIATAN ', '');
        } else {
            activityInput.value = '';
        }

        // Toggle Project Custom
        document.getElementById('projectCustom').classList.toggle('hidden', projVal !== 'CUSTOM');

        // Toggle Status Custom
        const statusVal = document.getElementById('statusActivity').value;
        document.getElementById('statusCustom').classList.toggle('hidden', statusVal !== 'CUSTOM');

        // Toggle Leader Custom
        const leaderSelect = document.getElementById('leaderSelect').value;
        document.getElementById('leaderCustom').classList.toggle('hidden', leaderSelect !== 'CUSTOM');

        // Toggle Tipe Lokasi
        const katLok = document.getElementById('katLokasi').value;
        document.getElementById('boxRusunBlok').classList.toggle('hidden', katLok !== 'RUSUN_BLOK');
        document.getElementById('boxRusunTower').classList.toggle('hidden', katLok !== 'RUSUN_TOWER');
        document.getElementById('boxPerumahan').classList.toggle('hidden', katLok !== 'PERUMAHAN');
        document.getElementById('boxCustom').classList.toggle('hidden', katLok !== 'CUSTOM');

        // Toggle Maintenance Box
        const boxMtn = document.getElementById('boxJenisMaintenance');
        if (jenisLapVal === 'KEGIATAN MAINTENANCE') {
            boxMtn.classList.remove('hidden');
        } else {
            boxMtn.classList.add('hidden');
        }

        const jenisKendala = document.getElementById('jenisKendala').value;
        const isTukarModem = (jenisLapVal === 'KEGIATAN MAINTENANCE' && jenisKendala === 'TUKAR_MODEM');
        const isKabelPutus = (jenisLapVal === 'KEGIATAN MAINTENANCE' && jenisKendala === 'KABEL_PUTUS');

        if (isTukarModem) {
            document.getElementById('groupSnOnu').classList.add('hidden');
            document.getElementById('groupSnTukarModem').classList.remove('hidden');
            document.getElementById('groupOdpPort').classList.add('hidden');
        } else if (isKabelPutus) {
            document.getElementById('groupSnOnu').classList.add('hidden');
            document.getElementById('groupSnTukarModem').classList.add('hidden');
            document.getElementById('groupOdpPort').classList.add('hidden');
            document.getElementById('groupInterfaceOnu').classList.add('hidden');
        } else {
            document.getElementById('groupSnOnu').classList.remove('hidden');
            document.getElementById('groupSnTukarModem').classList.add('hidden');
            document.getElementById('groupOdpPort').classList.remove('hidden');
            document.getElementById('groupInterfaceOnu').classList.remove('hidden');
        }

        generatePreview();
    }

    function formatHariTanggal(dateString) {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if(parts.length !== 3) return '';
        
        const date = new Date(parts[0], parts[1] - 1, parts[2]);
        const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        return date.toLocaleDateString('id-ID', options).toUpperCase();
    }

    function getSelectedJenisLaporan() {
        const val = document.getElementById('jenisLaporan').value;
        if (val === 'LAINNYA') {
            const customText = document.getElementById('jenisLaporanCustom').value.trim().toUpperCase();
            return customText ? `KEGIATAN ${customText}` : 'KEGIATAN ...';
        }
        return val;
    }

    function getSelectedProject() {
        const val = document.getElementById('project').value;
        if (val === 'CUSTOM') {
            return document.getElementById('projectCustom').value.trim().toUpperCase();
        }
        return val;
    }

    function getSelectedStatus() {
        const val = document.getElementById('statusActivity').value;
        if (val === 'CUSTOM') {
            return document.getElementById('statusCustom').value.trim().toUpperCase();
        }
        return val;
    }

    function getSelectedLeader() {
        const sel = document.getElementById('leaderSelect').value;
        if (sel === 'CUSTOM') {
            return document.getElementById('leaderCustom').value.trim() || '';
        }
        return sel;
    }

    function getSelectedPIC() {
        let picArr = [];
        document.querySelectorAll('.pic-check:checked').forEach(cb => picArr.push(cb.value));
        
        const customPic = document.getElementById('picCustom').value.trim();
        if (customPic) picArr.push(customPic);
        
        return picArr.length > 0 ? picArr.join('-') : '';
    }

    function formatUnitNumber(unitStr) {
        if (!unitStr) return '';
        let num = parseInt(unitStr, 10);
        if (isNaN(num)) return unitStr;
        return num < 10 ? '0' + num : num.toString();
    }

    function getFormattedLokasi() {
        const kat = document.getElementById('katLokasi').value;
        if (kat === 'RUSUN_BLOK') {
            const nama = document.getElementById('rusunBlokNama').value;
            const kode = document.getElementById('rusunBlokKode').value;
            const lt = document.getElementById('rusunBlokLantai').value || '';
            const unitRaw = document.getElementById('rusunBlokUnit').value;
            const unitFormatted = formatUnitNumber(unitRaw);
            
            const combinedUnit = (lt || unitFormatted) ? `UNIT ${lt}${unitFormatted}` : '';
            return `${nama.toUpperCase()} BLOK ${kode.toUpperCase()} ${combinedUnit}`.trim();

        } else if (kat === 'RUSUN_TOWER') {
            const nama = document.getElementById('rusunTowerNama').value;
            let kode = '';
            if (nama === 'Rusun Nagrak') {
                kode = document.getElementById('rusunTowerKodeSelect').value;
            } else {
                kode = document.getElementById('rusunTowerKode').value;
            }

            const lt = document.getElementById('rusunTowerLantai').value || '';
            const unitRaw = document.getElementById('rusunTowerUnit').value;
            const unitFormatted = formatUnitNumber(unitRaw);
            
            const combinedUnit = (lt || unitFormatted) ? `UNIT ${lt}${unitFormatted}` : '';
            
            if (nama === 'Rusun Pulogebang Tower') {
                return `${nama.toUpperCase()} ${combinedUnit}`.trim();
            } else {
                return `${nama.toUpperCase()} TOWER ${kode.toUpperCase()} ${combinedUnit}`.trim();
            }

        } else if (kat === 'PERUMAHAN') {
            const nama = document.getElementById('perumahanNama').value;
            const detail = document.getElementById('perumahanDetail').value;
            return `PERUMAHAN ${nama.toUpperCase()} ${detail.toUpperCase()}`.trim();
        } else if (kat === 'CUSTOM') {
            return document.getElementById('alamatCustom').value.toUpperCase();
        }
        return '';
    }

    function padLabel(label, width = 13) {
        return label.padEnd(width, ' ');
    }

    function generatePreview() {
        const jenisLapVal = document.getElementById('jenisLaporan').value;
        const jenisLap = getSelectedJenisLaporan();
        const tglVal = document.getElementById('tanggal').value;
        const hariTgl = formatHariTanggal(tglVal);
        const project = getSelectedProject();
        const lokasi = getFormattedLokasi();
        const clockIn = document.getElementById('clockIn').value;
        const clockOut = document.getElementById('clockOut').value;
        const activity = document.getElementById('activity').value;
        const status = getSelectedStatus();
        const pic = getSelectedPIC();
        const leader = getSelectedLeader();

        const problem = document.getElementById('problemText').value;
        const action = document.getElementById('actionText').value;

        const rawPower = document.getElementById('power').value;
        let power = rawPower ? `-${rawPower} dBm` : '';

        const onu = document.getElementById('interfaceOnu').value;
        const odp = document.getElementById('odpPort').value;
        const snNormal = document.getElementById('snOnu').value;
        const snLama = document.getElementById('snOntLama').value;
        const snBaru = document.getElementById('snOntBaru').value;
        const catatan = document.getElementById('catatan').value;

        const jenisKendala = document.getElementById('jenisKendala').value;
        const isTukarModem = (jenisLapVal === 'KEGIATAN MAINTENANCE' && jenisKendala === 'TUKAR_MODEM');
        const isKabelPutus = (jenisLapVal === 'KEGIATAN MAINTENANCE' && jenisKendala === 'KABEL_PUTUS');

        let textOut = `*⚡ CHECK IN & CHECK OUT ⚡*\n`;
        textOut += `──────────────────────────────\n`;
        textOut += `📅 *${hariTgl}*\n\n`;
        textOut += `*JENIS LAPORAN : ${jenisLap}*\n`;
        textOut += `${padLabel('Project')} : ${project}\n`;
        textOut += `${padLabel('Pic On Site')} : ${pic}\n`;
        textOut += `${padLabel('Leader')} : ${leader}\n`;
        textOut += `${padLabel('Lokasi')} : ${lokasi}\n`;
        textOut += `${padLabel('Clock In')} : ${clockIn}\n`;
        textOut += `${padLabel('Clock Out')} : ${clockOut}\n`;
        textOut += `${padLabel('Activity')} : ${activity}\n`;
        textOut += `${padLabel('Status Act.')} : ${status}\n`;

        if (jenisLapVal === 'KEGIATAN MAINTENANCE') {
            if (problem) textOut += `${padLabel('Problem')} : ${problem}\n`;
            if (action)  textOut += `${padLabel('Action')} : ${action}\n`;
        }

        textOut += `\n*🛠️ DATA TEKNIS*\n`;
        if (power) textOut += `${padLabel('POWER')} : ${power}\n`;
        if (!isKabelPutus && onu) textOut += `${padLabel('INTERFACE ONU')} : ${onu}\n`;
        if (!isTukarModem && !isKabelPutus && odp) textOut += `${padLabel('ODP PORT')} : ${odp}\n`;

        if (isTukarModem) {
            textOut += `${padLabel('SN ONT LAMA')} : ${snLama}\n`;
            textOut += `${padLabel('SN ONT BARU')} : ${snBaru}\n`;
        } else if (!isKabelPutus) {
            if (snNormal) textOut += `${padLabel('SN')} : ${snNormal}\n`;
        }

        if (catatan) textOut += `\n${padLabel('CATATAN')} : ${catatan}\n`;

        textOut += `\n──────────────────────────────\n`;
        textOut += `👥 Cc: @\n\n`;
        textOut += `*💼 The work has been completed safely. Thank you*`;

        document.getElementById('previewText').value = textOut;
    }

    function copyText() {
        const copyText = document.getElementById("previewText");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
        alert("Format Laporan berhasil disalin!");
    }

    function resetForm() {
        document.getElementById("reportForm").reset();
        document.querySelectorAll('.pic-check').forEach(cb => cb.checked = false);
        document.getElementById('leaderSelect').value = 'Yohan';
        setTanggalHariIni();
        updateViewAndPreview();
    }

    updateViewAndPreview();
</script>

</body>
</html>
